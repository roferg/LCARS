<!doctype html><html><body style="margin:0;font:14px system-ui;">
<div id="app" style="padding:24px">
  <h3>Q1 — the whole page inside one #app div: a tab bar, a segmented control and a pager</h3>
  <div id="tabs" role="tablist" style="position:absolute;left:24px;top:80px;display:flex;">
    <button style="height:34px;padding:0 16px;border:1px solid #888;border-right:0;">Overview</button><button style="height:34px;padding:0 16px;border:1px solid #888;border-right:0;">Activity</button><button style="height:34px;padding:0 16px;border:1px solid #888;">Settings</button>
  </div>
  <div id="seg" style="position:absolute;left:24px;top:140px;display:inline-flex;">
    <button style="height:30px;padding:0 12px;">Day</button><button style="height:30px;padding:0 12px;">Week</button>
  </div>
  <div id="pager" style="position:absolute;left:24px;top:200px;display:inline-flex;">
    <button style="height:30px;padding:0 12px;">Prev</button><button style="height:30px;padding:0 12px;">Next</button>
  </div>
</div>
</body></html>
