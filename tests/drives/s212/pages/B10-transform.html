<!doctype html><html><body style="margin:0;font:14px system-ui;padding:24px">
<h3>B10 — CSS transforms: a rotated label and a translated button</h3>
<button id="t-one" style="position:absolute;left:40px;top:100px;width:120px;height:36px;transform:translateX(0px);">ONE</button>
<button id="t-two" style="position:absolute;left:40px;top:100px;width:120px;height:36px;transform:translateX(140px);">TWO</button>
<span id="rot" style="position:absolute;left:40px;top:180px;transform:rotate(-8deg);display:inline-block;">rotated caption</span>
</body></html>
