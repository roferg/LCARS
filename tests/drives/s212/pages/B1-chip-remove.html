<!doctype html><html><body style="margin:0;font:14px system-ui;padding:24px">
<h3>B1 — a filter chip with its own embedded remove button (CORRECT UI)</h3>
<div id="chip" style="position:absolute;left:24px;top:80px;display:inline-flex;align-items:center;gap:0;background:#dde;border-radius:14px;padding:4px 6px 4px 12px;">
  <span id="chip-label">Active</span><button id="chip-remove" style="margin-left:6px;border:0;background:transparent;cursor:pointer;">&times;</button>
</div>
</body></html>
