<!doctype html><meta charset="utf-8"><title>MBR mini</title>
<style>
 body{font:14px system-ui;margin:0;padding:16px;background:#fff;color:#111}
 header{border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:12px}
 .screen{display:none} .screen.on{display:block}
 button{height:30px;padding:0 10px;border:1px solid #888;background:#f4f4f4;margin-right:6px}
 select{height:28px} textarea{width:320px;height:52px;display:block;margin:6px 0}
 .row{margin:10px 0}
</style>
<header>
  <strong>DX Scorecard</strong> — Developer Experience (DX) Scorecard · KPIs &amp; Insights ·
  Default view · Edit roster · MBR builder · Locked MBR (shared) · Data model
  <button id="themeBtn" aria-label="Switch to light mode">&#9789;</button>
</header>

<section id="s-start" class="screen on">
  <h2>Monthly business review</h2>
  <button data-go="collect">Pull data &amp; start</button>
  <button data-go="locked">View</button>
</section>

<section id="s-collect" class="screen">
  <h2>Pulling data · August 2026</h2>
  <div class="row"><button data-go="start">Cancel</button>
    <button data-go="build">Continue to builder</button></div>
</section>

<section id="s-build" class="screen">
  <h2>MBR builder · September 2026</h2>
  <div class="row">
    <select aria-label="Status for LTC P75"><option>On track</option><option>Watch</option><option>Off track</option></select>
    <textarea aria-label="Insight for LTC P75" placeholder="Add an insight for this KPI"></textarea>
  </div>
  <div class="row">
    <select aria-label="Status for Change Failure Rate"><option>On track</option><option>Watch</option><option>Off track</option></select>
    <textarea aria-label="Insight for Change Failure Rate" placeholder="Add an insight for this KPI"></textarea>
  </div>
  <div class="row"><button data-go="preview">Preview</button>
    <button data-go="locked">Lock month</button>
    <button data-go="start">Discard draft</button></div>
</section>

<section id="s-preview" class="screen">
  <h2>Preview · September 2026</h2>
  <div class="row"><button data-go="build">Back to builder</button></div>
</section>

<section id="s-locked" class="screen">
  <h2>Locked MBR</h2>
  <div class="row"><button data-go="start">Cancel</button></div>
</section>

<script>
 var NAMES = {start:"", collect:"#mbr/collect", build:"#mbr/build",
              preview:"#mbr/preview", locked:"#mbr/locked"};
 function show(k){
   var all = document.querySelectorAll(".screen");
   for (var i=0;i<all.length;i++) all[i].classList.remove("on");
   (document.getElementById("s-"+k)||document.getElementById("s-start")).classList.add("on");
   if (location.hash !== NAMES[k]) location.hash = NAMES[k] || "";
 }
 document.addEventListener("click", function(e){
   var b = e.target.closest ? e.target.closest("[data-go]") : null;
   if (b) show(b.getAttribute("data-go"));
 });
 function fromHash(){
   var h = location.hash;
   for (var k in NAMES) if (NAMES[k] === h) return show(k);
   show("start");
 }
 window.addEventListener("hashchange", fromHash); fromHash();
</script>
