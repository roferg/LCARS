<!doctype html><meta charset="utf-8"><title>MBR mini — the drawing</title>
<style>
 body{font:14px system-ui;margin:0;padding:16px;background:#fff;color:#111}
 button{height:30px;padding:0 10px;border:1px solid #888;background:#f4f4f4;margin-right:6px}
 select{height:28px} textarea{width:320px;height:52px;display:block;margin:6px 0}
 .screen{border:1px solid #ccc;padding:12px;margin-bottom:24px}
</style>
<!-- A HOLODECK DRAWING IS ONE LONG PAGE with every screen stacked down it,
     and it is hand-written HTML with NO aria-labels. Both facts are the
     point: "Cancel" is drawn twice, and the status select and insight box
     are named by what is PRINTED on them. -->
<div class="screen"><h2>SCREEN ONE — start</h2>
  <button>Pull data &amp; start</button><button>View</button>
  <button>Toggle theme</button></div>

<div class="screen"><h2>SCREEN TWO — collect</h2>
  <button>Cancel</button><button>Continue to builder</button>
  <button>Re-collect</button></div>

<div class="screen"><h2>SCREEN THREE — builder</h2>
  <select><option>On track</option><option>Watch</option><option>Off track</option></select>
  <textarea placeholder="Add an insight for this KPI"></textarea>
  <button>Preview</button><button>Lock month</button><button>Discard draft</button></div>

<div class="screen"><h2>SCREEN FOUR — locked</h2>
  <button>Cancel</button></div>
