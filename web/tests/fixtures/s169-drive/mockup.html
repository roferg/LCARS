<!doctype html>
<!--
  VISUAL REFERENCE ONLY — not shipping code.
  Trip board for "Waypoint": dark theme, left rail stop list, map fills the rest.
  Data below is fake and hard-coded; the "map" is a drawn SVG placeholder, not a
  real tile layer. This file exists to settle look & layout, nothing more.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint — Trip board</title>
<style>
  :root{
    /* Dark palette — introduced for this program (repo had none). */
    --bg:        #0f1216;   /* page / map backdrop */
    --panel:     #171b21;   /* left rail surface */
    --panel-2:   #1e242c;   /* raised row / hover */
    --line:      #262d36;   /* dividers (dark-mode heirs of #ddd/#eee) */
    --text:      #e7ecf2;   /* primary text (was #111) */
    --muted:     #8b97a6;   /* secondary text */
    --accent:    #4ea1ff;   /* route line + selection (new) */
    --accent-dim:#2b3d55;
    /* Spacing rhythm carried from basis: 6 / 12 / 16. */
    --s1:6px; --s2:12px; --s3:16px;
    --rail:320px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
  }

  /* Topbar — the .topbar/.brand + New trip seam, restyled dark. */
  .topbar{
    display:flex; align-items:center; gap:var(--s2);
    padding:var(--s2) var(--s3);
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{font-weight:700; letter-spacing:.3px}
  .brand .dot{color:var(--accent)}
  .topbar .spacer{flex:1}
  .total{
    display:flex; align-items:baseline; gap:6px;
    padding:6px var(--s2);
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel-2);
  }
  .total .label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px}
  .total .value{font-weight:700}
  .total .value b{font-size:18px}
  button{
    font:inherit; color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px var(--s2);
    cursor:pointer;
  }
  button:hover{background:#232a33; border-color:#334}
  button.primary{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:700}
  button.primary:hover{filter:brightness(1.08)}

  /* Body grid: left rail + map. */
  .stage{display:grid; grid-template-columns:var(--rail) 1fr; min-height:0}

  /* Left rail — the stop list. */
  .rail{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .rail-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:var(--s2) var(--s3);
    border-bottom:1px solid var(--line);
  }
  .rail-head h2{margin:0; font-size:13px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted)}
  .rail-head .count{font-size:12px; color:var(--muted)}

  #stops{list-style:none; margin:0; padding:var(--s1) 0; overflow:auto; flex:1}
  #stops li{
    display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:var(--s2);
    padding:var(--s2) var(--s3);
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  #stops li:hover{background:var(--panel-2)}
  #stops li.active{background:var(--accent-dim)}
  #stops li.active .pin{background:var(--accent); border-color:var(--accent); color:#06121f}
  .pin{
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
  }
  .stop-name{font-size:15px; line-height:1.2}
  .leg{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}

  .rail-foot{
    padding:var(--s2) var(--s3);
    border-top:1px solid var(--line);
    display:flex; gap:var(--s2); justify-content:space-between; align-items:center;
    color:var(--muted); font-size:12px;
  }

  /* Map — drawn placeholder filling the rest. */
  .map{position:relative; min-width:0; overflow:hidden; background:
      radial-gradient(1200px 800px at 70% 20%, #131922 0%, var(--bg) 70%);}
  .map svg{position:absolute; inset:0; width:100%; height:100%}
  .grid line{stroke:#1b222b; stroke-width:1}
  .route{fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .route-shadow{fill:none; stroke:#06121f; stroke-width:6; stroke-linecap:round; opacity:.5}
  .node{fill:var(--panel); stroke:var(--accent); stroke-width:2}
  .node.active{fill:var(--accent)}
  .nodelabel{fill:var(--text); font:12px system-ui; }
  .map-badge{
    position:absolute; left:var(--s3); bottom:var(--s3);
    background:rgba(15,18,22,.8); border:1px solid var(--line); border-radius:6px;
    padding:6px var(--s2); font-size:12px; color:var(--muted); backdrop-filter:blur(4px);
  }
  .map-scale{
    position:absolute; right:var(--s3); bottom:var(--s3);
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
  }
  .map-scale .bar{width:60px; height:4px; background:var(--muted); border-radius:2px; opacity:.6}
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Way<span class="dot">•</span>point</span>
    <div class="spacer"></div>
    <div class="total" title="Total distance across all legs">
      <span class="label">Total</span>
      <span class="value"><b id="totalKm">0</b> km</span>
    </div>
    <button id="new" class="primary">New trip</button>
  </header>

  <div class="stage">
    <aside class="rail">
      <div class="rail-head">
        <h2>Stops</h2>
        <span class="count" id="stopCount">0</span>
      </div>
      <ul id="stops"><!-- rendered by JS --></ul>
      <div class="rail-foot">
        <span id="footLegs">0 legs</span>
        <span id="footTotal">0 km total</span>
      </div>
    </aside>

    <section class="map" id="map">
      <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" id="mapSvg"><!-- drawn by JS --></svg>
      <div class="map-badge">Map is a placeholder — real tiles come later</div>
      <div class="map-scale"><span class="bar"></span><span>10 km</span></div>
    </section>
  </div>

<script>
  // Fake, in-memory trip. Positions are SVG coords, not real geography.
  const stops = [
    { name:'Home Base',       x:120, y:560, km:0  },
    { name:'Cedar Overlook',  x:300, y:430, km:14 },
    { name:'Miller Falls',    x:470, y:470, km:11 },
    { name:'Ridge Trailhead', x:640, y:300, km:22 },
    { name:'Lakeside Camp',   x:820, y:180, km:18 },
  ];
  let active = 0;

  const $ = s => document.querySelector(s);

  function totalKm(){ return stops.reduce((a,s)=>a+s.km,0); }

  function renderTotals(){
    const t = totalKm();
    $('#totalKm').textContent = t;
    $('#stopCount').textContent = stops.length;
    $('#footLegs').textContent = Math.max(stops.length-1,0) + ' legs';
    $('#footTotal').textContent = t + ' km total';
  }

  function renderList(){
    const ul = $('#stops');
    ul.innerHTML = stops.map((s,i)=>`
      <li class="${i===active?'active':''}" data-i="${i}">
        <span class="pin">${i+1}</span>
        <span class="stop-name">${s.name}</span>
        <span class="leg">${i===0?'start':'+'+s.km+' km'}</span>
      </li>`).join('');
    ul.querySelectorAll('li').forEach(li=>{
      li.onclick = ()=>{ active = +li.dataset.i; renderList(); renderMap(); };
    });
  }

  function renderMap(){
    const svg = $('#mapSvg');
    let g = '<g class="grid">';
    for(let x=0;x<=1000;x+=50) g+=`<line x1="${x}" y1="0" x2="${x}" y2="700"/>`;
    for(let y=0;y<=700;y+=50) g+=`<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`;
    g+='</g>';
    const d = stops.map((s,i)=>`${i?'L':'M'}${s.x} ${s.y}`).join(' ');
    g+=`<path class="route-shadow" d="${d}"/><path class="route" d="${d}"/>`;
    stops.forEach((s,i)=>{
      g+=`<circle class="node ${i===active?'active':''}" cx="${s.x}" cy="${s.y}" r="8"/>`;
      g+=`<text class="nodelabel" x="${s.x+14}" y="${s.y+4}">${s.name}</text>`;
    });
    svg.innerHTML = g;
  }

  // Fake "New trip" — mirrors repo's clear-then-render behaviour, on placeholder data.
  $('#new').onclick = ()=>{ /* placeholder: would start an empty trip */ };

  renderList(); renderMap(); renderTotals();
</script>
</body>
</html>
