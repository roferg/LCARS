<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCARS — Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Shared LCARS token set (served from docs/lcars.css — ADR-007, never forked) -->
<link rel="stylesheet" href="/lcars.css">
<!-- Board layout, vendored from kanban-vision.html's board/card/pill markup -->
<link rel="stylesheet" href="/board.css">
</head>
<body class="lcars-serve">

<!-- ════ LCARS ELBOW FRAME (S67-kanban) ════════════════════════════════════
     The whole console is wrapped in the iconic LCARS chrome: a single solid
     yellow TOP BAND that sweeps, via one fat rounded ELBOW at the top-left, into
     a single solid yellow LEFT RAIL — band + elbow + rail are ONE continuous
     colour L. The board content (columns + legend) nests INSIDE the frame — to
     the right of the rail, below the top band. The rail/top band are fixed
     frame; the columns scroll horizontally WITHIN .frame-content, so the rail
     never scrolls off-screen.
     Brand / #repoMeta / #fileBtn / #conn (the old .topbar nodes) are folded
     into the top band; their ids/classes are preserved for board.js + tests. -->
<div class="lcars-frame">

  <!-- the fat rounded corner joining top band ↔ left rail (one continuous L) -->
  <div class="frame-elbow" aria-hidden="true"></div>

  <!-- TOP BAND: one solid yellow bar carrying the brand + repo meta + conn -->
  <div class="frame-top topbar">
    <span class="band-block" aria-hidden="true"></span>
    <div class="brand">LCARS · <b>KANBAN</b></div>
    <span class="band-block band-grow" aria-hidden="true"></span>
    <!-- which repo is this board attached to? Filled from board.meta (S70-A). -->
    <div class="repo-meta" id="repoMeta" title="attached repository"></div>
    <!-- S139: the local main-deploy band + control. #mainDeploy renders the live
         deploy status from board.meta.mainLaunch (◐ DEPLOYING → ● MAIN LIVE →
         failed) on every render; the button opens the ▸ Deploy Main modal. -->
    <div class="main-deploy" id="mainDeploy" title="local main deploy"></div>
    <button class="btn go" id="deployMainBtn" type="button">▸ Deploy Main</button>
    <!-- S125 (D1): THE HOLODECK. One control, beside ▦ File Mission, that swaps
         the board content for the deck IN THIS FRAME — the elbow, the brand and
         the connection pill stay put. The same control reads ▦ BOARD on the way
         back; board.js owns the label. Not a tab strip: there are two surfaces,
         and a tab bar is furniture for a third that does not exist. -->
    <button class="btn go" id="holodeckBtn" type="button">⬡ Holodeck</button>
    <button class="btn go" id="fileBtn" type="button">▦ File Mission</button>
    <button class="btn help-btn" id="helpBtn" type="button" title="Help — press ?">?</button>
    <div class="conn" id="conn" title="live channel">● LIVE</div>
  </div>

  <!-- LEFT RAIL: one solid yellow bar (thin black dividers for LCARS flavour) -->
  <div class="frame-rail" aria-hidden="true">
    <div class="rail-div"></div>
    <div class="rail-div"></div>
    <div class="rail-fill"></div>
  </div>

  <!-- CONTENT AREA: the existing board + legend, behavior unchanged -->
  <div class="frame-content">

    <!-- S130 version banner: filled by board.js from board.meta.version when the
         LCARS install is stale (source behind / repo needs update). Hidden (and
         byte-identical to the pre-S130 board) when current. View-only builds show
         the banner WITHOUT the ENGAGE UPDATE button (read-safe info only). -->
    <div class="version-banner" id="versionBanner" hidden></div>

    <!-- S146 test-readiness banner: its OWN strip below the band (the version-
         banner placement idiom — NEVER inside the topbar button cluster, so it
         coexists with the Deploy Main control). Filled by board.js from
         board.meta.testReadiness; ABSENT meta ⇒ hidden and the board is
         byte-identical to a ready repo today. -->
    <div class="readiness-banner" id="readinessBanner" hidden></div>

    <!-- S141 first-run state: shown by board.js ONLY while the board holds zero
         missions, and hidden the moment the first one lands. It names the ▦ File
         Mission control and the ? console so a cold board teaches itself. No
         pulse, no nag, nothing persistent. -->
    <div class="board-empty" id="boardEmpty" hidden></div>

    <!-- S125 (D7 · VIEW ONLY): on a read-only build the holodeck writes files,
         so it cannot run — and the reason is SAID, not left to a greyed button
         nobody can interrogate. Hidden (and the board byte-identical to its
         pre-S125 self) on every write board. -->
    <div class="holo-banner ro" id="holoRoBanner" hidden></div>

    <!-- S125 (D1): the holodeck's content area. Empty and hidden until the deck
         is entered; `body.on-deck` is what hides the board furniture above and
         below it (a CSS class, because render() rebuilds this area on every SSE
         tick and would wipe a JS `hidden` flag). -->
    <div class="deck-host" id="deckHost" hidden></div>

    <!-- S184 ESTABLISH VISION — the day-zero FRONT DOOR. Filled by board.js from
         board.meta.frontDoor, which the daemon sets ONLY when this repo has no
         test foundation AND has nothing to put on a board. When it is filled,
         `body.on-front-door` hides the board, the legend and the empty-state
         prompt: the front door REPLACES the board rather than sitting above a
         locked one (captain ruling 2026-09-05 — "the board does not render until
         there is something to put on it"). Hidden, and the board byte-identical
         to its pre-S184 self, on every repo that has a foundation. -->
    <div class="front-door" id="frontDoor" hidden></div>

    <div class="board-wrap">
      <div class="board" id="board"><!-- columns + cards injected by board.js --></div>
    </div>

    <div class="legend">
      <span><i style="background:var(--lcars-red)"></i> Awaiting you</span>
      <!-- --lcars-pink is the ONE accent this board uses that docs/lcars.css does
           not define, so the fallback is load-bearing, not belt-and-braces: with
           it omitted the declaration was invalid at computed-value time and this
           chip painted nothing at all while keeping a perfect 12x12 box (S168,
           measured in Chrome). Every other pink in board.css already carries the
           same #ff66aa fallback. Proven by tests/drives/browser/legend-swatches.sh. -->
      <span><i style="background:var(--lcars-pink,#ff66aa)"></i> Child bug mission</span>
      <span><i style="background:var(--lcars-teal)"></i> Ticket green</span>
      <span class="dim" id="status">loading…</span>
      <span class="dim viewonly" id="viewonly" hidden>● VIEW-ONLY — writes disabled</span>
    <!-- S191: the forge could not be reached, so the board is showing LOCAL
         missions only. Hidden unless the daemon says so (meta.remote.status);
         a board with no gh never carries that key, so this never appears. -->
    <span class="dim remote-note" id="remoteNote" hidden></span>
    </div>
  </div>

</div>

<!-- ════ Overlay host: every screen (detail + operator modals) renders here. ════
     A single centered overlay (NOT the old side drawer). board.js fills #overlayBody
     with the active screen and toggles `hidden`. -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-stage" id="overlayBody"><!-- screen injected by board.js --></div>
</div>

<script src="/board.js"></script>
</body>
</html>
